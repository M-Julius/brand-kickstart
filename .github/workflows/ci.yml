name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # pinned: ubuntu-latest (26.04) has no Python 3.9, the oldest version we support
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No `pip install`: the suite proves the core runs on the standard library alone.
      - run: python -m unittest discover -s tests -v
      - name: platforms.json is valid JSON
        run: python -m json.tool skills/brand-kickstart/scripts/platforms.json > /dev/null
